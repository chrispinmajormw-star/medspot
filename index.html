<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medspot</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1E9; --panel:#FFFFFF; --panel-2:#FBFAF6; --ink:#1F2A24; --ink-soft:#67766E; --ink-faint:#98A39C;
  --line:#E4E0D3; --primary:#1F5D50; --primary-deep:#123D34; --accent:#E3A73B; --alert:#C15C4A;
  --pharmacy:#2E8069; --hospital:#BD5A44; --shadow:0 10px 30px -12px rgba(18,61,52,.25);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1B18; --panel:#16241F; --panel-2:#132019; --ink:#EEF2EF; --ink-soft:#9DB0A8; --ink-faint:#6D8078;
    --line:#243731; --shadow:0 10px 30px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1B18; --panel:#16241F; --panel-2:#132019; --ink:#EEF2EF; --ink-soft:#9DB0A8; --ink-faint:#6D8078;
  --line:#243731; --shadow:0 10px 30px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);height:100%;overflow:hidden}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0}

#app{position:relative;height:100%}
#map{position:absolute;inset:0}
.leaflet-control-attribution{font-size:10px}

/* Floating top bar */
.topbar{
  position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:16px;right:16px;z-index:500;
  display:flex;flex-direction:column;gap:10px;
}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px}
.brand .mark{
  width:34px;height:34px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:17px;box-shadow:var(--shadow);flex:none;
}
.brand h1{font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-0.02em}
.stat-pill{
  background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12.5px;
  color:var(--ink-soft);box-shadow:var(--shadow);white-space:nowrap;
}
.stat-pill b{color:var(--primary)}
:root[data-theme="dark"] .stat-pill b, @media (prefers-color-scheme:dark){.stat-pill b{color:#7FCBB0}}

.toolbar{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:10px;display:flex;flex-direction:column;gap:10px;
}
.search{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:10px;background:var(--panel-2)}
.search svg{flex:none;color:var(--ink-faint)}
.search input{border:none;background:transparent;outline:none;font:inherit;font-size:14.5px;color:var(--ink);width:100%}
.row2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip-group{display:flex;gap:6px}
.chip{
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink-soft);padding:7px 13px;border-radius:20px;
  font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.radius-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);margin-left:auto}
.radius-row input[type=range]{accent-color:var(--primary);width:90px}
.radius-row b{color:var(--ink);font-weight:600}

/* Custom markers */
.pin{position:relative;width:30px;height:38px}
.pin svg{filter:drop-shadow(0 3px 5px rgba(0,0,0,.3))}
.pin.closed{opacity:.55}
.user-dot{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 5px rgba(227,167,59,.35)}
.pulse{animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(227,167,59,.45)}70%{box-shadow:0 0 0 14px rgba(227,167,59,0)}100%{box-shadow:0 0 0 0 rgba(227,167,59,0)}}
.leaflet-popup-content-wrapper{border-radius:12px}
.leaflet-popup-content{font-family:'Inter',sans-serif;font-size:13px;margin:12px 14px}
.pop-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;margin-bottom:2px}

/* List panel */
#panel{
  position:absolute;top:calc(158px + env(safe-area-inset-top,0px));right:16px;bottom:16px;width:380px;z-index:500;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;
}
#list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
.card{
  background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;
  transition:border-color .15s,transform .15s;opacity:0;transform:translateY(6px);animation:in .35s ease forwards;
}
@keyframes in{to{opacity:1;transform:translateY(0)}}
.card:hover{border-color:var(--primary)}
.card.active{border-color:var(--primary);background:var(--panel)}
.c-top{display:flex;gap:10px;align-items:flex-start}
.icon{
  width:36px;height:36px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;
}
.icon.pharmacy{background:var(--pharmacy)}
.icon.hospital{background:var(--hospital)}
.c-title{flex:1;min-width:0}
.c-title h3{font-size:14.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-meta{font-size:12px;color:var(--ink-soft);margin-top:2px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;flex:none}
.pill.open{background:rgba(46,128,105,.15);color:var(--pharmacy)}
.pill.closed{background:rgba(193,92,74,.15);color:var(--alert)}
.stock{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 10px}
.tag{font-size:11px;background:var(--panel);border:1px solid var(--line);color:var(--ink-soft);padding:3px 8px;border-radius:7px}
.tag.match{background:rgba(227,167,59,.2);border-color:var(--accent);color:var(--ink);font-weight:600}
.foot{display:flex;justify-content:space-between;align-items:center}
.hours{font-size:11.5px;color:var(--ink-faint)}
.go{
  display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#fff;background:var(--primary);
  padding:6px 11px;border-radius:20px;text-decoration:none;
}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink-soft);font-size:13.5px;text-align:center;padding:40px 20px}

.view-toggle{display:none}

@media (max-width:760px){
  .topbar{right:12px;left:12px}
  #panel{
    left:12px;right:12px;width:auto;top:auto;bottom:0;border-radius:18px 18px 0 0;
    max-height:62vh;display:none;
  }
  main.show-list #panel{display:flex}
  .view-toggle{
    display:flex;gap:8px;position:absolute;left:12px;right:12px;z-index:500;
    bottom:calc(12px + env(safe-area-inset-bottom,0px));
  }
  .view-toggle button{
    flex:1;padding:11px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);
    font:inherit;font-size:13px;font-weight:700;box-shadow:var(--shadow);
  }
  .view-toggle button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
}
</style>
</head>
<body>
<main id="app">
  <div id="map"></div>

  <div class="topbar">
    <div class="brand-row">
      <div class="brand">
        <div class="mark">✚</div>
        <h1>Medspot</h1>
      </div>
      <div class="stat-pill"><b id="countBadge">0</b> places · <b id="openBadge">0</b> open near you</div>
    </div>
    <div class="toolbar">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" placeholder="Search a drug or service — amoxicillin, X-ray…">
      </div>
      <div class="row2">
        <div class="chip-group" id="typeChips">
          <button class="chip active" data-type="all">All</button>
          <button class="chip" data-type="pharmacy">Pharmacies</button>
          <button class="chip" data-type="hospital">Hospitals</button>
        </div>
        <div class="radius-row">Within <b id="radiusLabel">5 km</b>
          <input type="range" id="radiusSlider" min="1" max="5" value="5" step="1">
        </div>
      </div>
    </div>
  </div>

  <div id="panel"><div id="list"></div></div>

  <div class="view-toggle">
    <button class="active" data-view="map">Map</button>
    <button data-view="list">List</button>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const USER = { lat: -13.9626, lng: 33.7741 };

const LOCATIONS = [
  { id:1, name:"Kamuzu Central Pharmacy", type:"pharmacy", lat:-13.9558, lng:33.7812, open:true, hours:"7:00–20:00",
    stock:["Amoxicillin","Paracetamol","ORS Sachets","Insulin","Malaria test kits"] },
  { id:2, name:"Area 18 Community Clinic", type:"hospital", lat:-13.9701, lng:33.7699, open:true, hours:"24 hours",
    stock:["Emergency care","Maternity ward","X-ray","Blood tests","Wound dressing"] },
  { id:3, name:"City Centre Chemist", type:"pharmacy", lat:-13.9612, lng:33.7688, open:false, hours:"8:00–18:00",
    stock:["Ibuprofen","Cough syrup","Antihistamines","Contraceptives"] },
  { id:4, name:"Lilongwe General Hospital", type:"hospital", lat:-13.9789, lng:33.7825, open:true, hours:"24 hours",
    stock:["Emergency care","Surgery","ICU","Oxygen","Blood transfusion"] },
  { id:5, name:"Old Town Pharmacy", type:"pharmacy", lat:-13.9740, lng:33.7601, open:true, hours:"7:30–19:00",
    stock:["Paracetamol","Amoxicillin","Vitamins","Diabetes test strips"] },
  { id:6, name:"Area 25 Health Post", type:"hospital", lat:-13.9450, lng:33.7770, open:true, hours:"7:00–17:00",
    stock:["General consultation","Vaccination","Malaria test kits","ORS Sachets"] },
  { id:7, name:"Capital Hill Pharmacy", type:"pharmacy", lat:-13.9495, lng:33.7655, open:true, hours:"8:00–21:00",
    stock:["Antibiotics","Painkillers","Insulin","Baby formula"] },
  { id:8, name:"Riverside Medical Centre", type:"hospital", lat:-13.9903, lng:33.7690, open:false, hours:"8:00–16:00",
    stock:["General consultation","Dental care","Eye clinic","X-ray"] },
];

function haversine(a,b){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const x=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
LOCATIONS.forEach(l=> l.dist = haversine(USER,{lat:l.lat,lng:l.lng}));

const ICONS = {
  pharmacy: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  hospital: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};

function pinIcon(loc){
  const color = loc.type==='pharmacy' ? 'var(--pharmacy)' : 'var(--hospital)';
  const hex = loc.type==='pharmacy' ? '#2E8069' : '#BD5A44';
  const html = `<div class="pin${loc.open?'':' closed'}">
    <svg width="30" height="38" viewBox="0 0 30 38">
      <path d="M15 0C6.7 0 0 6.7 0 15c0 10.5 15 23 15 23s15-12.5 15-23C30 6.7 23.3 0 15 0z" fill="${hex}"/>
      <circle cx="15" cy="15" r="9" fill="#fff"/>
    </svg>
    <div style="position:absolute;top:6px;left:0;width:30px;text-align:center;color:${hex};font-weight:700;font-size:13px;font-family:'Space Grotesk',sans-serif;">${loc.type==='pharmacy'?'Rx':'H'}</div>
  </div>`;
  return L.divIcon({html, className:'', iconSize:[30,38], iconAnchor:[15,36], popupAnchor:[0,-34]});
}

let map, markers={};
function initMap(){
  map = L.map('map',{zoomControl:false, attributionControl:true}).setView([USER.lat,USER.lng],13);
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19}).addTo(map);

  L.circle([USER.lat,USER.lng],{radius:5000,color:'#1F5D50',weight:1,fillOpacity:0.04}).addTo(map);
  L.marker([USER.lat,USER.lng],{icon:L.divIcon({html:'<div class="user-dot pulse"></div>',className:'',iconSize:[16,16],iconAnchor:[8,8]})})
    .addTo(map).bindPopup('<b class="pop-name">You are here</b>');

  LOCATIONS.forEach(loc=>{
    const m = L.marker([loc.lat,loc.lng],{icon:pinIcon(loc)}).addTo(map);
    m.bindPopup(`<div class="pop-name">${loc.name}</div>${loc.dist.toFixed(1)} km · ${loc.open?'Open now':'Closed'}<br>${loc.stock.slice(0,3).join(', ')}`);
    m.on('click',()=> setActive(loc.id));
    markers[loc.id]=m;
  });
}

let state = { type:'all', query:'', radius:5, active:null, firstRender:true };

function filtered(){
  const q = state.query.trim().toLowerCase();
  return LOCATIONS.filter(l=>{
    if (l.dist > state.radius) return false;
    if (state.type!=='all' && l.type!==state.type) return false;
    if (q && !(l.name.toLowerCase().includes(q) || l.stock.some(s=>s.toLowerCase().includes(q)))) return false;
    return true;
  }).sort((a,b)=>a.dist-b.dist);
}

function render(){
  const items = filtered();
  document.getElementById('countBadge').textContent = items.length;
  document.getElementById('openBadge').textContent = items.filter(i=>i.open).length;
  const list = document.getElementById('list');
  const q = state.query.trim().toLowerCase();

  Object.values(markers).forEach(m=> map.removeLayer(m));
  items.forEach(loc=> markers[loc.id].addTo(map));

  if (!items.length){
    list.innerHTML = `<div class="empty">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Nothing matches within ${state.radius} km.<br>Try widening the radius or clearing your search.
    </div>`;
    return;
  }

  list.innerHTML = items.map((loc,i)=>{
    const stockHTML = loc.stock.map(s=>{
      const match = q && s.toLowerCase().includes(q);
      return `<span class="tag${match?' match':''}">${s}</span>`;
    }).join('');
    const delay = state.firstRender ? (i*45) : 0;
    return `
      <div class="card${state.active===loc.id?' active':''}" data-id="${loc.id}" style="animation-delay:${delay}ms">
        <div class="c-top">
          <div class="icon ${loc.type}">${ICONS[loc.type]}</div>
          <div class="c-title">
            <h3>${loc.name}</h3>
            <div class="c-meta">${loc.dist.toFixed(1)} km away</div>
          </div>
          <span class="pill ${loc.open?'open':'closed'}">${loc.open?'Open':'Closed'}</span>
        </div>
        <div class="stock">${stockHTML}</div>
        <div class="foot">
          <span class="hours">${loc.hours}</span>
          <a class="go" href="https://www.openstreetmap.org/?mlat=${loc.lat}&mlon=${loc.lng}#map=16/${loc.lat}/${loc.lng}" target="_blank" rel="noopener">
            Directions
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>
      </div>`;
  }).join('');
  state.firstRender = false;

  list.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=> setActive(Number(card.dataset.id)));
  });
}

function setActive(id){
  state.active = id;
  const loc = LOCATIONS.find(l=>l.id===id);
  if (loc){ map.flyTo([loc.lat,loc.lng],15,{duration:0.6}); markers[id].openPopup(); }
  render();
}

document.getElementById('searchInput').addEventListener('input', e=>{ state.query=e.target.value; render(); });
document.getElementById('typeChips').addEventListener('click', e=>{
  if (e.target.classList.contains('chip')){
    document.querySelectorAll('#typeChips .chip').forEach(c=>c.classList.remove('active'));
    e.target.classList.add('active'); state.type = e.target.dataset.type; render();
  }
});
document.getElementById('radiusSlider').addEventListener('input', e=>{
  state.radius = Number(e.target.value);
  document.getElementById('radiusLabel').textContent = state.radius + ' km';
  render();
});
document.querySelectorAll('.view-toggle button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.view-toggle button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('app').classList.toggle('show-list', btn.dataset.view==='list');
    if (btn.dataset.view==='map') setTimeout(()=>map.invalidateSize(),50);
  });
});

initMap();
render();
</script>
</body>
</html>
